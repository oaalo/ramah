                    <span style="display:block; padding-right:28px; color:#a0b0c0; font-size:0.85rem; margin-top:2px;">(فرد عادي ← مشرف ميداني ← مشرف عام ← قيادة ← نائب قائد ← قائد الهلال)</span>
                </li>
                <li>
                    <span class="error-title">قيادة غير واقعية</span>
                    <span class="penalty">العقوبة: عقوبة رقابية</span>
                </li>
                <li>
                    <span class="error-title">تشغيل أغاني بصوت عالٍ جداً وتسبب إزعاج لمن حولك</span>
                    <span class="penalty">العقوبة: نفس عقوبة سرقة الحالات (غرامة 2,500,000 + خصم 15 ألف خبرة + تأخير ترقية)</span>
                </li>
                <li>
                    <span class="error-title">التوجه للإستنفار الأمني دون إذن مسبق من العمليات</span>
                    <span class="penalty">العقوبة: تعاقب عليها حسب التقييم (أولوية التوجه: قيادة ← مشرف عام ← مشرف ميداني ← عمليات ← فرد)</span>
                </li>
            </ul>
            `
        }, {
            title: '🚫 المحظورات',
            content: `
            <ul>
                <li><strong>التهرب الوظيفي:</strong> يمنع تغير الوظيفة بأي شكل من الأشكال إلا في حالة اخذ إجازة</li>
                <li><strong>حمل ممنوعات:</strong> يمنع حمل ممنوعات: شدات، مخدرات، ستر ضد رصاص، خوذ حماية الرأس، أسلحة سواء عسكرية أو مواطنين</li>
                <li><strong>مباشرة دون وجود في الموجة</strong></li>
                <li><strong>تدبيل عضلة X عند إنعاش</strong></li>
                <li><strong>تدبيل مسقط انت و اخوك</strong></li>
                <li><strong>رسبون سرير</strong> تبند عليه من الحماية</li>
                <li><strong>رسبون كرسي متحرك</strong> تبند عليه من الحماية</li>
                <li><strong>مباشرة في مركبة غير مخصصة لمستواك</strong></li>
                <li><strong>تقليل إحترام على باقي الأفراد او التحرش بالكادر النسائي</strong></li>
                <li><strong>عدم الرد في الراديو</strong> سجن رقابي وانت داخل الوظيف</li>
                <li><strong>طلب استقالة من متدرب او مستوى 1</strong></li>
            </ul>
            <div class="note">
                <i class="fas fa-info-circle"></i>
                <strong>ملاحظة:</strong> هذه القائمة قابلة للتعديل في أي وقت – الهيئة العامة للهلال الأحمر
            </div>
            `,
            exams: [
                { name: 'اختبار توظيف', url: 'quiz.html?q=job', icon: 'fas fa-user-plus' }
            ]
        }];

        const total = slidesData.length;
        let currentIndex = 0;
        const wrapper = document.getElementById('slideWrapper');
        const dotsContainer = document.getElementById('dotsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentNumSpan = document.getElementById('currentSlideNum');
        const totalNumSpan = document.getElementById('totalSlidesNum');
function buildSlides() {
            wrapper.innerHTML = '';
            slidesData.forEach((s, idx) => {
                const div = document.createElement('div');
                div.className = `slide ${idx === currentIndex ? 'active' : ''}`;
                div.dataset.index = idx;
                const titleDiv = document.createElement('div');
                titleDiv.className = 'slide-title';
                titleDiv.innerHTML = `${s.title}`;
                div.appendChild(titleDiv);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'slide-content';
                contentDiv.innerHTML = s.content;
                div.appendChild(contentDiv);
if (s.exams && s.exams.length > 0) {
                    const examSection = document.createElement('div');
                    examSection.className = 'exam-section';
                    const examLabel = document.createElement('div');
                    examLabel.className = 'exam-label';
                    examLabel.innerHTML = '<i class="fas fa-clipboard-check"></i> اختبار لقياس مدى فهمك';
                    examSection.appendChild(examLabel);
                    const btnGroup = document.createElement('div');
                    btnGroup.className = 'exam-btn-group';
                    s.exams.forEach(exam => {
                        const btn = document.createElement('a');
                        btn.className = 'exam-btn';
                        btn.href = exam.url;
                        btn.target = '_blank';
                        btn.rel = 'noopener noreferrer';
                        btn.innerHTML = `<i class="${exam.icon || 'fas fa-file-alt'}"></i> ${exam.name}`;
                        btnGroup.appendChild(btn);
                    });
                    examSection.appendChild(btnGroup);
                    div.appendChild(examSection);
                }

                wrapper.appendChild(div);
            });

            dotsContainer.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('button');
                dot.className = `dot ${i === currentIndex ? 'active' : ''}`;
                dot.setAttribute('aria-label', `السلايد رقم ${i + 1}`);
                dot.type = 'button';
                dot.dataset.index = i;
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
            totalNumSpan.textContent = total;
            updateUI();
        }

        function goToSlide(index) {
            if (index < 0 || index >= total) return;
            currentIndex = index;
            updateUI();
            document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('active', i === currentIndex));
            document.querySelectorAll('.dot').forEach((el, i) => el.classList.toggle('active', i === currentIndex));
        }
        function updateUI() {
            currentNumSpan.textContent = currentIndex + 1;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === total - 1;
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) goToSlide(currentIndex - 1); });
        nextBtn.addEventListener('click', () => { if (currentIndex < total - 1) goToSlide(currentIndex + 1); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); if (currentIndex < total - 1) goToSlide(currentIndex + 1); }
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); if (currentIndex > 0) goToSlide(currentIndex - 1); }
        });

        buildSlides();
    })();
</script>
    <script src="watermark.js" defer></script>
    <script src="protect.js" defer></script>
</body>
</html>
