    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(145deg, #17100e 0%, #3a2b25 100%); color: #e2e8f0; padding: 2rem; direction: rtl; line-height: 2; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 1000px; width: 100%; margin: 0 auto; background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(18px); border-radius: 48px; padding: 2.5rem 2.5rem 1.8rem; border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7); }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 1.2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 1.5rem; }
        .header h1 { color: #e6c0a4; font-size: 2rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: #e6c0a4; }
        .header-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .back-link { display: inline-block; color: #e3b295; text-decoration: none; font-weight: 800; font-size: 0.95rem; transition: 0.3s; background: rgba(255,255,255,0.05); padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.06); }
        .back-link:hover { color: #e6c0a4; background: rgba(255,255,255,0.08); }
        .slide-counter { background: rgba(255, 255, 255, 0.07); padding: 6px 20px; border-radius: 60px; color: #b8d0e0; font-weight: 700; font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .slide-counter span { color: #fff; font-weight: 900; }
        .slide-wrapper { position: relative; min-height: 400px; }
        .slide { display: none; animation: fadeSlide 0.35s ease; background: rgba(169, 97, 74, 0.20); border-radius: 32px; padding: 2rem 2.2rem; border: 1px solid rgba(212, 122, 94, 0.20); box-shadow: inset 0 2px 0 rgba(212, 122, 94, 0.10); }
        .slide.active { display: block; }
        @keyframes fadeSlide { 0% { opacity: 0.3; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
        .slide-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 12px; border-right: 5px solid #e6c0a4; padding-right: 18px; }
        .slide-title i { color: #e6c0a4; }
        .slide-content { color: #e2e8f0; font-size: 1.05rem; line-height: 2; max-height: 460px; overflow-y: auto; padding-left: 4px; }
        .slide-content::-webkit-scrollbar { width: 4px; }
        .slide-content::-webkit-scrollbar-track { background: transparent; }
        .slide-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 20px; }
        .slide-content strong { color: #fff; }
        .slide-content ul { list-style: none; padding: 0; }
        .slide-content ul li { padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: row; align-items: flex-start; gap: 8px; }
        .slide-content ul li::before { content: "▸"; color: #e6c0a4; font-weight: 700; flex-shrink: 0; }
        .slide-content .note { background: rgba(209, 139, 104, 0.10); padding: 12px 16px; border-radius: 12px; border-right: 3px solid #e6c0a4; margin: 1.2rem 0; color: #cbd5e1; }
        .slide-content .note i { color: #e6c0a4; margin-left: 8px; }
        .slide-content .warning-note { background: rgba(209, 139, 104, 0.15); padding: 12px 16px; border-radius: 12px; border-right: 3px solid #e6c0a4; margin: 1.2rem 0; color: #e6c0a4; }
        .slide-content .warning-note i { color: #e6c0a4; margin-left: 8px; }
        .slide-content h3 { color: #e6c0a4; font-size: 1.2rem; font-weight: 800; margin: 1.2rem 0 0.5rem; }
        .exam-section { margin-top: 1.8rem; padding: 1.5rem; border-radius: 20px; background: linear-gradient(145deg, rgba(169, 97, 74, 0.15), rgba(169, 97, 74, 0.08)); border: 1px solid rgba(230, 192, 164, 0.25); display: flex; flex-direction: column; gap: 14px; }
        .exam-section .exam-label { color: #e6c0a4; font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .exam-section .exam-label i { font-size: 1.3rem; }
        .exam-btn-group { display: flex; flex-wrap: wrap; gap: 12px; }
        .exam-btn { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(145deg, #a9614a, #7d4433); color: #fff; padding: 12px 28px; border-radius: 60px; font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 1rem; text-decoration: none; transition: all 0.2s; box-shadow: 0 6px 20px rgba(169, 97, 74, 0.25); border: 1px solid rgba(230, 192, 164, 0.3); }
        .exam-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 30px rgba(169, 97, 74, 0.45); background: linear-gradient(145deg, #d18b68, #a9614a); }
        .exam-btn i { color: #e6c0a4; }
        .nav-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.05); flex-wrap: wrap; gap: 12px; }
        .nav-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); color: #d6e5f0; padding: 10px 28px; border-radius: 60px; font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 10px; }
        .nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.12); transform: scale(1.02); }
        .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
        .nav-btn.primary { background: #e6c0a4; border-color: #e6c0a4; color: #0b0d10; }
        .nav-btn.primary:hover:not(:disabled) { background: #ffe066; border-color: #ffe066; }
        .dots { display: flex; gap: 8px; align-items: center; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); transition: all 0.25s; cursor: pointer; border: none; }
        .dot.active { background: #e6c0a4; width: 28px; border-radius: 30px; }
        .dot:hover { background: rgba(255, 255, 255, 0.30); }
        @media (max-width: 768px) {
            body { padding: 1rem; } .container { padding: 1.5rem; } .header h1 { font-size: 1.5rem; }
            .slide { padding: 1.2rem; } .slide-title { font-size: 1.4rem; } .slide-content { font-size: 0.95rem; }
            .nav-btn { padding: 8px 18px; font-size: 0.85rem; } .header-left { flex-wrap: wrap; }
            .exam-btn { padding: 10px 20px; font-size: 0.9rem; }
        }
        .page-footer {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            flex-wrap: wrap; margin-top: 1.6rem; padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.88rem; color: #94a3b8; text-align: center;
        }
        .page-footer a {
            color: #e3b295; text-decoration: none; font-weight: 800;
            background: rgba(255,255,255,0.04); padding: 6px 16px;
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }
        .page-footer a:hover { background: rgba(255,255,255,0.08); color: #e6c0a4; }

<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-user-tie"></i> دورة المشرفين</h1>
        <div class="header-left">
            <a href="index.html?section=careers" class="back-link"><i class="fas fa-arrow-right"></i> العودة للدورات</a>
            <div class="slide-counter"><i class="fas fa-layer-group"></i> سلايد <span id="currentSlideNum">1</span> / <span id="totalSlidesNum">0</span></div>
        </div>
    </div>
    <div class="slide-wrapper" id="slideWrapper"></div>
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" disabled><i class="fas fa-chevron-right"></i> السابق</button>
        <div class="dots" id="dotsContainer"></div>
        <button class="nav-btn primary" id="nextBtn">التالي <i class="fas fa-chevron-left"></i></button>
    <div class="page-footer">
        <a href="rights.html"><i class="fas fa-scale-balanced"></i> الحقوق وشروط الاستخدام</a>
        <span>© 2026 جهاد 511 (.ji.) وNJM</span>
    </div>
</div>

<script>
    (function() {
        'use strict';

        const slidesData = [{
            title: '👔 تعريف المشرف وأولويته',
            content: `
            <p style="color:#cbd5e1;">
                المشرف الميداني هو شخص مسؤول عن تنسيق العمليات الميدانية، يقوم بمراقبة أداء المسعفين، وتنظيم الاستجابة للبلاغات، والتأكد من تطبيق القوانين والإجراءات المعتمدة داخل الميدان.
                <br><br>
                كما يتولى مراجعة مشاكل المسعفين ومعالجتها ميدانيًا أو رفعها للجهات المختصة عند الحاجة.
                وينطبق هذا التعريف على المشرف العام، مع اختلاف نطاق الصلاحيات والمسؤوليات بين المنصبين.
            </p>
            <h3>🎯 أولويات المشرف</h3>
            <ul>
                <li>التأكد من وجود مركز عمليات فعّال قبل دخول المدينة.</li>
                <li>مراجعة تقارير العمليات والتأكد من تسجيل جميع المسعفين المتواجدين.</li>
                <li>التأكد من جاهزية جميع الوحدات وتواجدها الصحيح داخل الموجة.</li>
                <li>مراجعة البلاغات والتأكد من سلاسة الانتقال بينها بدون تداخل أو إهمال.</li>
                <li>توجيه غرفة العمليات في حال وجود خطأ أو سوء تنظيم.</li>
                <li>مراقبة الوحدات داخل الميدان بشكل مستمر.</li>
                <li>إنزال تقرير إشرافي يوثّق حالة العمل الميداني.</li>
            </ul>
            `
        }, {
            title: '🛠️ مهام المشرف',
            content: `
            <ul>
                <li>مراقبة سير العمليات وإعادة تنظيمها عند الحاجة.</li>
                <li>مراجعة تقارير العمليات والتأكد من دقتها واكتمالها.</li>
                <li>مراقبة الوحدات المتواجدة في الميدان والتأكد من التزامها بالمهام.</li>
                <li>متابعة البلاغات وضمان التعامل معها حسب الأولوية.</li>
                <li>الإشراف المباشر على أفراد الهلال الأحمر أثناء تأدية الواجب.</li>
                <li>التأكد من التزام جميع الأفراد بقوانين الهلال الأحمر وقوانين السيرفر.</li>
                <li>تنظيم العمل الميداني وضمان سير الحالات الطبية بشكل واقعي ومنظم.</li>
                <li>معالجة الأخطاء الميدانية بشكل فوري ومنع تكرارها.</li>
                <li>رفع الشكاوى والملاحظات إلى الشؤون الإدارية.</li>
                <li>إنزال تقارير الإشراف بشكل دوري ومنظم.</li>
            </ul>
            `
        }, {
            title: '✅ مسؤوليات ومحظورات إدارية',
            content: `
            <h3>مسؤوليات إضافية</h3>
            <ul>
                <li>الحفاظ على انضباط العمل داخل الميدان.</li>
                <li>دعم المسعفين ميدانيًا وتقديم التوجيه عند الحاجة.</li>
                <li>التنسيق مع الجهات الأخرى في الحالات المشتركة.</li>
                <li>تمثيل الهلال الأحمر بصورة احترافية داخل المدينة.</li>
                <li>المساهمة في تحسين جودة الأداء الميداني بشكل مستمر.</li>
            </ul>
            <h3>🚫 محظورات إدارية</h3>
            <ul>
                <li>استغلال المنصب أو الصلاحيات لتحقيق مصلحة شخصية.</li>
                <li>اتخاذ قرارات فردية مصيرية دون الرجوع للقيادة العليا عند الحاجة.</li>
                <li>التهديد أو إساءة استخدام السلطة مع الأعضاء.</li>
                <li>إخفاء المخالفات أو التستر على أخطاء جسيمة.</li>
            </ul>
            <h3>🚑 محظورات ميدانية</h3>
            <ul>
                <li>التدخل في الحالات بدون تنسيق أو تصريح.</li>
                <li>تعطيل عمل الفرق أو سحبهم من البلاغات دون سبب مبرر.</li>
                <li>فرض أوامر ميدانية تخالف قوانين الهلال الأحمر أو السيرفر.</li>
                <li>تجاهل سلامة الأفراد أو المصابين أثناء العمليات.</li>
                <li>استخدام الصلاحيات الميدانية خارج وقت الواجب.</li>
            </ul>
            `
        }, {
            title: '📻 محظورات التواصل والعامة',
            content: `
            <h3>محظورات التواصل</h3>
            <ul>
                <li>استخدام الراديو أو القنوات الرسمية لغير أغراض العمل.</li>
                <li>نشر معلومات داخلية أو إدارية خارج القطاع.</li>
                <li>التحدث بأسلوب غير لائق أو غير مهني مع الأفراد أو القطاعات الأخرى.</li>
                <li>إثارة الجدل أو الخلافات داخل القنوات الرسمية.</li>
            </ul>
            <h3>👥 محظورات التعامل مع الأفراد</h3>
            <ul>
                <li>التقليل من شأن أي عضو أو السخرية منه.</li>
                <li>الضغط على الأفراد للاستمرار رغم ظروفهم.</li>
                <li>تجاهل شكاوى الأعضاء أو التقليل من أهميتها.</li>
                <li>فرض عقوبات دون توضيح السبب أو بدون توثيق.</li>
            </ul>
            <h3>⚠️ محظورات عامة</h3>
            <ul>
                <li>مخالفة قوانين السيرفر أو الرول بلاي.</li>
                <li>إعطاء صلاحيات أو امتيازات بدون تفويض.</li>
                <li>تمثيل الهلال الأحمر بشكل يسيء لسمعته.</li>
                <li>الجهل المتعمد بالقوانين أو عدم تطبيقها.</li>
            </ul>
            <div class="warning-note">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>ملاحظة:</strong><br>
                أي مشرف يخالف هذه المحظورات يعرض نفسه للمحاسبة الإدارية.<br>
                تكرار المخالفات أو المخالفات الجسيمة قد تؤدي إلى العزل من المنصب.<br>
                المنصب القيادي مسؤولية قبل أن يكون صلاحية.
            </div>
            `,
            exams: [
                { name: 'اختبار مشرف ميداني', url: 'quiz.html?q=supervisor-field', icon: 'fas fa-user-shield' },
                { name: 'اختبار مشرف عام', url: 'quiz.html?q=supervisor-general', icon: 'fas fa-user-tie' }
            ]
        }];

        const total = slidesData.length;
        let currentIndex = 0;
        const wrapper = document.getElementById('slideWrapper');
        const dotsContainer = document.getElementById('dotsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentNumSpan = document.getElementById('currentSlideNum');
        const totalNumSpan = document.getElementById('totalSlidesNum');
function buildSlides() {
            wrapper.innerHTML = '';
            slidesData.forEach((s, idx) => {
                const div = document.createElement('div');
                div.className = `slide ${idx === currentIndex ? 'active' : ''}`;
                div.dataset.index = idx;
                const titleDiv = document.createElement('div');
                titleDiv.className = 'slide-title';
                titleDiv.innerHTML = `${s.title}`;
                div.appendChild(titleDiv);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'slide-content';
                contentDiv.innerHTML = s.content;
                div.appendChild(contentDiv);
if (s.exams && s.exams.length > 0) {
                    const examSection = document.createElement('div');
                    examSection.className = 'exam-section';
                    const examLabel = document.createElement('div');
                    examLabel.className = 'exam-label';
                    examLabel.innerHTML = '<i class="fas fa-clipboard-check"></i> اختبار لقياس مدى فهمك';
                    examSection.appendChild(examLabel);
                    const btnGroup = document.createElement('div');
                    btnGroup.className = 'exam-btn-group';
                    s.exams.forEach(exam => {
                        const btn = document.createElement('a');
                        btn.className = 'exam-btn';
                        btn.href = exam.url;
                        btn.target = '_blank';
                        btn.rel = 'noopener noreferrer';
                        btn.innerHTML = `<i class="${exam.icon || 'fas fa-file-alt'}"></i> ${exam.name}`;
                        btnGroup.appendChild(btn);
                    });
                    examSection.appendChild(btnGroup);
                    div.appendChild(examSection);
                }

                wrapper.appendChild(div);
            });

            dotsContainer.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('button');
                dot.className = `dot ${i === currentIndex ? 'active' : ''}`;
                dot.setAttribute('aria-label', `السلايد رقم ${i + 1}`);
                dot.type = 'button';
                dot.dataset.index = i;
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
            totalNumSpan.textContent = total;
            updateUI();
        }

        function goToSlide(index) {
            if (index < 0 || index >= total) return;
            currentIndex = index;
            updateUI();
            document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('active', i === currentIndex));
            document.querySelectorAll('.dot').forEach((el, i) => el.classList.toggle('active', i === currentIndex));
        }
        function updateUI() {
            currentNumSpan.textContent = currentIndex + 1;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === total - 1;
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) goToSlide(currentIndex - 1); });
        nextBtn.addEventListener('click', () => { if (currentIndex < total - 1) goToSlide(currentIndex + 1); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); if (currentIndex < total - 1) goToSlide(currentIndex + 1); }
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); if (currentIndex > 0) goToSlide(currentIndex - 1); }
        });

        buildSlides();
    })();
</script>
    <script src="watermark.js" defer></script>
    <script src="protect.js" defer></script>
</body>
</html>
