<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="شعار محافظة الرمح">
  <defs>
    <radialGradient id="stone" cx="36%" cy="24%" r="88%">
      <stop offset="0%" stop-color="#403935"/>
      <stop offset="42%" stop-color="#292322"/>
      <stop offset="100%" stop-color="#0f0c0b"/>
    </radialGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e0cc"/>
      <stop offset="18%" stop-color="#c89372"/>
      <stop offset="42%" stop-color="#8a5a43"/>
      <stop offset="62%" stop-color="#c68f6c"/>
      <stop offset="82%" stop-color="#edd0b8"/>
      <stop offset="100%" stop-color="#9c6a4e"/>
    </linearGradient>

    <linearGradient id="rose" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#fbe6d7"/>
      <stop offset="24%" stop-color="#e8bd9e"/>
      <stop offset="52%" stop-color="#c68f6c"/>
      <stop offset="76%" stop-color="#9b6549"/>
      <stop offset="100%" stop-color="#d7a888"/>
    </linearGradient>

    <linearGradient id="roseHi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5a43" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#e8bd9e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbe6d7" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#787b80"/>
      <stop offset="24%" stop-color="#eaeaec"/>
      <stop offset="48%" stop-color="#b4b7ba"/>
      <stop offset="70%" stop-color="#f7f7f8"/>
      <stop offset="100%" stop-color="#85888d"/>
    </linearGradient>

    <linearGradient id="steelTip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#85888d"/>
      <stop offset="32%" stop-color="#ffffff"/>
      <stop offset="66%" stop-color="#c6c8cb"/>
      <stop offset="100%" stop-color="#6f7277"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.14"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <clipPath id="discClip">
      <circle cx="256" cy="256" r="226"/>
    </clipPath>
  </defs>

  <!-- الإطار المعدني -->
  <circle cx="256" cy="256" r="250" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="241" fill="#0c0a09"/>
  <circle cx="256" cy="256" r="233" fill="url(#rim)" opacity="0.75"/>

  <!-- القرص الحجري -->
  <g clip-path="url(#discClip)">
    <circle cx="256" cy="256" r="226" fill="url(#stone)"/>
    <rect x="30" y="30" width="452" height="452" fill="#6b5c53" filter="url(#grain)" opacity="0.45"/>
    <circle cx="256" cy="256" r="226" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="26"/>
    <path d="M104 196 L152 174 L190 192 L226 168" stroke="#000" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <path d="M352 344 L392 314 L418 320" stroke="#000" stroke-opacity="0.3" stroke-width="3" fill="none"/>
    <path d="M160 366 L200 392 L208 424" stroke="#000" stroke-opacity="0.26" stroke-width="3" fill="none"/>
  </g>

  <!-- حرف R -->
  <g filter="url(#softShadow)">
    <path d="M 190 108 L 190 400 L 246 400 L 246 300 L 330 400 L 396 400 L 302 286
             C 346 268 370 234 370 192 C 370 144 332 108 268 108 Z"
          fill="url(#rose)"/>
    <path d="M 246 150 L 246 244 L 266 244 C 312 244 330 226 330 197 C 330 166 312 150 272 150 Z"
          fill="#161211"/>
    <path d="M 190 108 L 190 400 L 198 400 L 198 108 Z" fill="url(#roseHi)"/>
    <path d="M 246 150 L 246 244 L 252 244 L 252 150 Z" fill="url(#roseHi)" opacity="0.8"/>
  </g>

  <!-- الرمح -->
  <g filter="url(#softShadow)">
    <path d="M 224 40 C 240 74 254 104 254 130 L 254 148 L 202 148 L 202 130
             C 202 104 216 74 224 40 Z" fill="url(#steelTip)"/>
    <path d="M 224 40 C 231 74 238 104 238 130 L 238 148 L 202 148 L 202 130 C 202 104 216 74 224 40 Z"
          fill="#ffffff" opacity="0.3"/>
    <rect x="198" y="150" width="60" height="9" rx="2" fill="url(#steel)"/>
    <rect x="202" y="165" width="52" height="6" rx="2" fill="url(#steel)" opacity="0.9"/>
    <rect x="202" y="176" width="52" height="6" rx="2" fill="url(#steel)" opacity="0.75"/>
    <rect x="221" y="183" width="14" height="240" fill="url(#steel)"/>
    <rect x="221" y="183" width="4.5" height="240" fill="#ffffff" opacity="0.35"/>
    <rect x="213" y="421" width="30" height="11" rx="2" fill="url(#steel)"/>
    <path d="M 221 432 L 235 432 L 228 484 Z" fill="url(#steelTip)"/>
  </g>
</svg>
